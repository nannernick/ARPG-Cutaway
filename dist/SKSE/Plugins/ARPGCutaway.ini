; ARPG Cutaway - settings. Restart Skyrim after editing.
; Distances are Skyrim units (a human is roughly 128 tall).

[General]
Enabled = 1
; 1 = only run in interior cells
InteriorOnly = 1
; 1 = horizontal cut (clip plane), 0 = hide whole meshes
Mode = 1

[Cut]
; Everything above this height over your feet is cut away (walls, roofs, beams).
Height = 220
; Selective mode only: meshes within this distance of you get cut.
Radius = 2500
; 1 = draw every mesh with the cut projection so depth stays consistent
; (props and characters stay visible). 0 = only cut meshes that cross the plane.
AllGeometry = 1
; How fast the cut rises behind you, away from the camera, so far walls stay
; full height. 1 = 45 degrees, 0.5 = gentler, 0 = flat cut everywhere.
Slope = 1.0
; The cut height is anchored per area. It only re-anchors if you stand this far
; above/below it (e.g. another floor) for ReanchorDelay seconds on the ground.
; Jumping and falling never count.
ReanchorDistance = 150
ReanchorDelay = 1.0
; Every height change (new floor, lifting, dropping) eases in over about this
; many seconds, and never moves faster than MaxHeightSpeed units/second.
HeightSmoothing = 0.6
MaxHeightSpeed = 800

; Two styles, switch in game with ToggleKey:
;   AutoLift = 1  only cut when something blocks the camera's view of you;
;                 open caves and tall halls stay full height
;   AutoLift = 0  always cut (Diablo look)
AutoLift = 1
; DirectX scan code: 68 = F10, 87 = F11, 88 = F12, 0 = no key.
ToggleKey = 68
; Auto style: seconds the view must be clear before the cut rises,
; and how far it rises (at the top the cut switches off).
ClearDelay = 0.75
LiftMax = 600

[Cells]
; Per-interior overrides by editor ID (shown in the log as [cell] '...').
; A number sets that interior's cut height; off disables the cut there.
; RiverwoodSleepingGiantInn = 260
; SomeCaveEditorID = off

[Sweep]
; Mode 0 only below here (except [Background] and [Debug]).
; The corridor runs from the camera to this height above the player's feet.
HeadHeight = 120
; Pieces whose bounds come within this distance of the corridor can be hidden.
CorridorRadius = 400
; Seconds between sweeps.
Interval = 0.05
MinCameraDistance = 50

[Hide]
; A piece is hidden only if its center is at least this high above the player's feet.
MinHeight = 200
; Pieces at least this high (roofs, ceilings) are hidden anywhere near you.
; Pieces between MinHeight and this are only hidden on the camera's side of you.
CeilingHeight = 350
; How far behind you a wall-height piece can be and still get hidden.
BehindMargin = 100
; Pieces bigger than this (radius) are never hidden.
MaxShapeRadius = 700
; Seconds a piece stays hidden after it stops qualifying.
Linger = 1.0
; Once hidden, a piece must move this far past a threshold before it comes back.
Hysteresis = 75

[Background]
; Set interior fog colors to black while you are inside.
BlackFog = 1
; Hide the sky dome while inside; it shows through removed roofs.
HideSky = 1

[Debug]
; Logs cell fog colors, hidden pieces, and [perf]/[cut] lines.
Log = 1
